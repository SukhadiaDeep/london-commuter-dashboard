<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Commuter Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚇 London Commuter Pro</h1>
            <p>Live Tube Status Updates</p>
        </header>

        <section class="arrivals-section">
            <h2>⏱️ Next Arrivals (Oxford Circus)</h2>
            <div id="arrivals-list">
                <p>Loading arrivals...</p>
            </div>
        </section>

        <hr> <section class="status-section">
            <h2>📊 Line Status</h2>
            <div id="status-container" class="status-grid">
                <p>Connecting to TfL...</p>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
